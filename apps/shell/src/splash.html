<!doctype html>
<html lang="es">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contab</title>
<style>
  :root{
    --azul:#3B82F6; --azul-lit:#7aa6fb; --ambar:#F2A33C; --indigo:#5b6ef5;
    --fg:#eaf0fb; --muted:#8294b3;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#04050d;overflow:hidden;user-select:none;cursor:default}

  .cosmos{position:fixed;inset:0;overflow:hidden;transition:opacity .5s ease;
    background:radial-gradient(135% 105% at 50% 46%,#15173a 0%,#0a0b1f 46%,#04050d 100%)}

  .neb{position:absolute;border-radius:50%;filter:blur(64px);opacity:0;mix-blend-mode:screen}
  .neb.a{width:62vmax;height:62vmax;left:-24vmax;top:-28vmax;background:radial-gradient(circle,rgba(59,130,246,.36),transparent 60%)}
  .neb.b{width:54vmax;height:54vmax;right:-22vmax;bottom:-26vmax;background:radial-gradient(circle,rgba(242,163,60,.22),transparent 60%)}
  .neb.c{width:48vmax;height:48vmax;right:6vmax;top:-22vmax;background:radial-gradient(circle,rgba(91,110,245,.26),transparent 60%)}
  .go .neb{animation:nebIn 2.2s ease-out .2s forwards}
  @keyframes nebIn{to{opacity:1}}

  .streak{position:absolute;left:50%;top:50%;width:2px;height:15px;border-radius:2px;margin:-7px 0 0 -1px;
    background:linear-gradient(to top,rgba(122,166,251,0),#e9f0ff);transform-origin:center;opacity:0}
  .go .streak{animation:warp var(--dur,.6s) linear var(--delay,0s) forwards}
  @keyframes warp{0%{opacity:0;transform:rotate(var(--a)) translateY(var(--r0,-14px)) scaleY(.3)}
    12%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(var(--r1,-700px)) scaleY(2)}}

  .field{position:absolute;inset:0;opacity:0}
  .go .field{animation:fieldIn 1.2s ease-out 1.15s forwards}
  @keyframes fieldIn{to{opacity:1}}
  .star-bg{position:absolute;border-radius:50%;background:#cdd9f3;opacity:0;animation:tw var(--d,3s) ease-in-out infinite;animation-delay:var(--delay,0s)}
  @keyframes tw{0%,100%{opacity:.08;transform:scale(.8)}50%{opacity:var(--max,.7);transform:scale(1)}}
  .sparkle{position:absolute;opacity:0;animation:sptw var(--d,4s) ease-in-out var(--delay,0s) infinite}
  .sparkle::before,.sparkle::after{content:"";position:absolute;background:linear-gradient(var(--g,to right),transparent,#eaf2ff,transparent)}
  .sparkle::before{left:50%;top:0;width:1.3px;height:100%;margin-left:-.65px}
  .sparkle::after{top:50%;left:0;height:1.3px;width:100%;margin-top:-.65px}
  @keyframes sptw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:var(--max,.85);transform:scale(1) rotate(22deg)}}

  .shoot{position:absolute;width:var(--len,120px);height:2px;border-radius:2px;
    background:linear-gradient(to right,rgba(255,255,255,0),#fff);opacity:0;transform-origin:left center}
  .go .shoot{animation:shoot var(--sd,1.1s) ease-in var(--sdelay,1.8s) forwards}
  @keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(var(--rot,20deg)) scaleX(.2)}
    14%{opacity:.9}100%{opacity:0;transform:translate(var(--dx,420px),var(--dy,150px)) rotate(var(--rot,20deg)) scaleX(1)}}

  .ship-layer{position:absolute;inset:0}
  .ship-layer svg{width:100%;height:100%;overflow:visible;display:block}
  .contrail{fill:none;stroke:url(#trailgrad);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:0}
  .ship{opacity:0;offset-rotate:auto;offset-distance:0%;filter:drop-shadow(0 0 6px rgba(122,166,251,.7))}
  .nac{filter:drop-shadow(0 0 5px #74a9ff) drop-shadow(0 0 10px var(--azul))}
  .go .contrail{animation:ride2 2.05s linear .85s forwards, trailfade .6s ease-in 2.75s forwards}
  .go .ship{animation:ride2 2.05s linear .85s forwards, shipfade .5s ease-in 2.7s forwards, shipIn .35s ease-out .85s forwards}
  @keyframes ride2{from{offset-distance:0%;stroke-dashoffset:100}to{offset-distance:100%;stroke-dashoffset:0}}
  @keyframes shipIn{from{opacity:0}to{opacity:1}}
  @keyframes shipfade{to{opacity:0}}
  @keyframes trailfade{to{opacity:0}}

  .center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vmin}
  .logobox{position:relative;width:34vmin;height:34vmin;display:grid;place-items:center}
  .bloom{position:absolute;width:155%;height:155%;border-radius:50%;opacity:0;
    background:radial-gradient(circle,rgba(59,130,246,.5),rgba(91,110,245,.18) 45%,transparent 66%)}
  .go .bloom{animation:bloomIn 1.4s ease-out 3.6s forwards, breathe 4.5s ease-in-out 5s infinite}
  @keyframes bloomIn{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
  @keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.78;transform:scale(1.06)}}
  .ambient{position:absolute;width:154%;height:154%;display:grid;place-items:center;opacity:0}
  .go .ambient{animation:ambIn 1.1s ease-out 2.7s forwards}
  .ambient svg{width:100%;height:100%;animation:spin 46s linear infinite}
  @keyframes ambIn{to{opacity:.5}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .logo{position:relative;width:100%;height:100%}
  .logo svg{width:100%;height:100%;overflow:visible}
  .ring,.kk path{fill:none;stroke:var(--azul);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 5px rgba(59,130,246,.85))}
  .ring{stroke-dasharray:100;stroke-dashoffset:100;opacity:0}
  .kk path{stroke-dasharray:100;stroke-dashoffset:100;opacity:0}
  .starC{fill:#fff;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 9px var(--azul-lit)) drop-shadow(0 0 18px var(--azul));
    offset-path:path("M44,48 A20,20 0 1 1 44,16");offset-distance:0%;opacity:0}
  .planet{fill:var(--ambar);transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;
    filter:drop-shadow(0 0 6px rgba(242,163,60,.9))}
  .word{text-align:center;opacity:0;transform:translateY(10px);font-family:var(--serif);
    font-size:clamp(1.6rem,5.4vmin,3rem);letter-spacing:.01em;color:var(--fg)}
  .word .tag{display:block;margin-top:.5rem;font-family:var(--mono);font-size:clamp(.6rem,1.5vmin,.8rem);
    letter-spacing:.36em;text-transform:uppercase;color:var(--muted)}

  .enter{margin-top:1vmin;opacity:0;transform:translateY(8px);font-family:var(--sans);font-weight:600;
    font-size:clamp(.9rem,2.1vmin,1.05rem);color:#fff;cursor:pointer;border:0;border-radius:12px;
    padding:.8rem 1.8rem;display:inline-flex;align-items:center;gap:.55rem;
    background:linear-gradient(180deg,#4b8bf7,#2f6fe0);box-shadow:0 10px 30px -8px rgba(59,130,246,.7),inset 0 1px 0 rgba(255,255,255,.25)}
  .enter svg{width:1.05em;height:1.05em}
  .enter:hover{transform:translateY(-1px);box-shadow:0 14px 36px -8px rgba(59,130,246,.85),inset 0 1px 0 rgba(255,255,255,.3)}
  .enter:focus-visible{outline:2px solid #cfe0ff;outline-offset:3px}
  .enter.loading{cursor:progress;opacity:.85}
  .enter.loading svg{display:none}
  .go .enter{animation:enterIn .7s ease-out 5.3s forwards, pulse 2.8s ease-in-out 6.2s infinite}
  @keyframes enterIn{to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{box-shadow:0 10px 30px -8px rgba(59,130,246,.55),inset 0 1px 0 rgba(255,255,255,.25)}50%{box-shadow:0 12px 40px -6px rgba(59,130,246,.95),inset 0 1px 0 rgba(255,255,255,.3)}}

  .go .ring{animation:draw 1.25s cubic-bezier(.4,0,.2,1) 2.95s forwards}
  .go .starC{animation:ride 1.25s cubic-bezier(.4,0,.2,1) 2.95s forwards, starf .35s ease-out 4.05s forwards}
  .go .kk path{animation:draw .55s ease-out forwards}
  .go .kk path:nth-child(1){animation-delay:4.05s}
  .go .kk path:nth-child(2){animation-delay:4.22s}
  .go .kk path:nth-child(3){animation-delay:4.39s}
  .go .planet{animation:pop .6s cubic-bezier(.2,1.4,.4,1) 4.1s forwards}
  .go .word{animation:rise .8s ease-out 4.6s forwards}
  .go .glow{animation:halo 2.6s ease-in-out 4.9s infinite}
  @keyframes draw{from{stroke-dashoffset:100;opacity:1}to{stroke-dashoffset:0;opacity:1}}
  @keyframes ride{from{offset-distance:0%;opacity:1}to{offset-distance:100%;opacity:1}}
  @keyframes starf{to{opacity:0;transform:scale(.4)}}
  @keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.35);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  @keyframes halo{0%,100%{filter:drop-shadow(0 0 5px rgba(59,130,246,.85))}50%{filter:drop-shadow(0 0 12px rgba(59,130,246,1))}}

  @media (prefers-reduced-motion:reduce){
    .go .streak,.go .ship,.go .contrail,.go .shoot{display:none}
    .go .neb,.go .field,.go .ambient,.go .bloom{animation:none;opacity:1}
    .go .ring,.go .kk path{animation:none;stroke-dashoffset:0;opacity:1}
    .go .starC{display:none}
    .go .planet{animation:none;transform:scale(1);opacity:1}
    .go .word{animation:none;opacity:1;transform:none}
    .go .enter{animation:none;opacity:1;transform:none}
  }
</style>
</head>
<body>
<div class="cosmos go" id="stage">
  <div class="neb a"></div>
  <div class="neb b"></div>
  <div class="neb c"></div>
  <div class="field" id="field"></div>

  <div class="ship-layer">
    <svg id="shipsvg" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="trailgrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="0">
          <stop offset="0" stop-color="rgba(59,130,246,0)"/>
          <stop offset="1" stop-color="rgba(122,166,251,.85)"/>
        </linearGradient>
      </defs>
      <path id="contrail" class="contrail" pathLength="100"/>
      <g class="ship" id="ship"><g transform="scale(1.5)">
        <path d="M-2,3 L-17,-12" stroke="#8ea0c8" stroke-width="2.4" fill="none"/>
        <path d="M-15,4 L-28,-9" stroke="#8ea0c8" stroke-width="2.4" fill="none"/>
        <rect x="-52" y="-16" width="48" height="6.6" rx="3.3" fill="#bccbed"/>
        <circle class="nac" cx="-6" cy="-12.7" r="3.7" fill="#74a9ff"/>
        <rect x="-46" y="-7" width="42" height="5.8" rx="2.9" fill="#9fb1d6"/>
        <circle class="nac" cx="-6" cy="-4.1" r="3.2" fill="#74a9ff"/>
        <ellipse cx="-6" cy="6" rx="23" ry="5.8" fill="#cdd9f3"/>
        <circle cx="16" cy="6" r="2.4" fill="#74a9ff"/>
        <path d="M21,1 L12,3 L11,8 L21,5 Z" fill="#cdd9f3"/>
        <ellipse cx="33" cy="-1" rx="21" ry="6.8" fill="#e8eefb"/>
        <ellipse cx="34" cy="-3.2" rx="9.5" ry="3.1" fill="#c2cfee"/>
      </g></g>
    </svg>
  </div>

  <div class="center">
    <div class="logobox">
      <div class="bloom"></div>
      <div class="ambient" aria-hidden="true">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(122,166,251,.4)" stroke-width=".35" stroke-dasharray="1 5" stroke-linecap="round"/></svg>
      </div>
      <div class="logo">
        <svg viewBox="0 0 64 64" aria-label="Contab">
          <path class="ring" pathLength="100" d="M44,48 A20,20 0 1 1 44,16"/>
          <g class="kk glow">
            <path pathLength="100" d="M28,24 V40"/>
            <path pathLength="100" d="M28,32 L40,24"/>
            <path pathLength="100" d="M28,32 L40,40"/>
          </g>
          <circle class="planet" cx="44" cy="16" r="3.3"/>
          <circle class="starC" cx="0" cy="0" r="2.4"/>
        </svg>
      </div>
    </div>
    <div class="word">Contab<span class="tag">Conciliación contable</span></div>
    <button class="enter" id="enter" type="button">
      <span class="label">Ingresar</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>

<script>
  var seed = 11;
  function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  var stage = document.getElementById('stage');
  var field = document.getElementById('field');

  var reach = Math.max(window.innerWidth, window.innerHeight);
  for (var i = 0; i < 130; i++) {
    var s = document.createElement('span'); s.className = 'streak';
    s.style.setProperty('--a', (rnd() * 360).toFixed(1) + 'deg');
    s.style.setProperty('--r0', (-8 - rnd() * 22) + 'px');
    s.style.setProperty('--r1', (-(reach * 0.55) - rnd() * reach * 0.4).toFixed(0) + 'px');
    s.style.setProperty('--dur', (0.5 + rnd() * 0.45).toFixed(2) + 's');
    s.style.setProperty('--delay', (rnd() * 1.2).toFixed(2) + 's');
    stage.appendChild(s);
  }
  for (var j = 0; j < 150; j++) {
    var st = document.createElement('span'); st.className = 'star-bg';
    var sz = 0.6 + rnd() * 2.1; st.style.width = st.style.height = sz + 'px';
    st.style.left = (rnd() * 100) + '%'; st.style.top = (rnd() * 100) + '%';
    st.style.setProperty('--d', (2 + rnd() * 3.5) + 's');
    st.style.setProperty('--delay', (rnd() * 3) + 's');
    st.style.setProperty('--max', (0.4 + rnd() * 0.5).toFixed(2));
    field.appendChild(st);
  }
  for (var k = 0; k < 7; k++) {
    var sp = document.createElement('span'); sp.className = 'sparkle';
    var ssz = 10 + rnd() * 16; sp.style.width = sp.style.height = ssz + 'px';
    sp.style.left = (5 + rnd() * 90) + '%'; sp.style.top = (5 + rnd() * 85) + '%';
    sp.style.setProperty('--d', (3 + rnd() * 3) + 's');
    sp.style.setProperty('--delay', (rnd() * 4) + 's');
    sp.style.setProperty('--max', (0.6 + rnd() * 0.4).toFixed(2));
    field.appendChild(sp);
  }
  var shoots = [[12, 14, 1.9, 460, 150], [70, 8, 3.0, -380, 170]];
  for (var m = 0; m < shoots.length; m++) {
    var c = shoots[m], sh = document.createElement('span'); sh.className = 'shoot';
    sh.style.left = c[0] + '%'; sh.style.top = c[1] + '%';
    sh.style.setProperty('--len', (90 + rnd() * 60) + 'px');
    sh.style.setProperty('--sdelay', c[2] + 's');
    sh.style.setProperty('--sd', (0.9 + rnd() * 0.4).toFixed(2) + 's');
    sh.style.setProperty('--dx', c[3] + 'px'); sh.style.setProperty('--dy', c[4] + 'px');
    sh.style.setProperty('--rot', (Math.atan2(c[4], c[3]) * 180 / Math.PI).toFixed(1) + 'deg');
    field.appendChild(sh);
  }

  var svg = document.getElementById('shipsvg');
  var contrail = document.getElementById('contrail');
  var ship = document.getElementById('ship');
  function layoutShip(){
    var W = window.innerWidth, H = window.innerHeight;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    var d = 'M ' + (-80) + ',' + (H*0.96).toFixed(0) + ' C ' + (W*0.30).toFixed(0) + ',' + (H*0.88).toFixed(0)
          + ' ' + (W*0.58).toFixed(0) + ',' + (H*0.30).toFixed(0) + ' ' + (W+80) + ',' + (-60);
    contrail.setAttribute('d', d);
    ship.style.offsetPath = 'path("' + d + '")';
  }
  layoutShip();
  window.addEventListener('resize', layoutShip);

  // ── Ingresar → abre la app (IPC al proceso principal) ──
  var enterBtn = document.getElementById('enter');
  var entering = false;
  function doEnter(){
    if (entering) return; entering = true;
    enterBtn.classList.add('loading');
    enterBtn.querySelector('.label').textContent = 'Entrando…';
    if (window.contabSplash) window.contabSplash.enter();
  }
  enterBtn.addEventListener('click', doEnter);
  window.addEventListener('keydown', function(e){ if (e.key === 'Enter') doEnter(); });
  if (window.contabSplash && window.contabSplash.onLoading) {
    window.contabSplash.onLoading(function(){
      enterBtn.classList.add('loading');
      enterBtn.querySelector('.label').textContent = 'Entrando…';
    });
  }
</script>
</body>
</html>
